<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
</head>
<body>
    Hello

    <script>
        class Hello {
            constructor() {
                this.right = "hello";
            }
        }

        class World extends Hello {
            constructor() {
                super();
            }

            update() {
                this.right = "World";
            }
        }

        class Hohayo extends Hello {
            constructor(){
                super();
            }

            lookUp() {
                console.log(this.right);
            }
        }

        const hello = new World();
        const hohayo = new Hohayo();
        console.log("hello",hello.right);
        console.log("hohayo",hohayo.right);

        hello.update();
        console.log("hello 1",hello.right);
        console.log("hohayo 2",hohayo.right);

        hohayo.lookUp();
    </script>
</body>
</html>
